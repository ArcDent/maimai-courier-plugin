# 麦麦搬运喵配置
# 字段含义与默认值见 config.py，术语见 CONTEXT.md；两处默认值必须逐项一致。

[plugin]
# 插件总开关。默认关闭：先填好白名单再打开，避免安装即跨群发送。
enabled = false
config_version = "1.0.0"

[auto]
# 源群合并转发是否给源群 Maisaka 一次自主判断机会。
# 只控制自动入口，不影响总开关开启时的显式工具调用。
enabled = true

[scope]
# 源群白名单：允许麦麦从中转发消息的群号；留空则没有源群。
source_groups = []
# 目标群白名单：允许接收转发消息的群号；留空则没有目标群。
target_groups = []
