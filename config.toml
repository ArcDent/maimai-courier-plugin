# 麦麦搬运喵配置
# 字段含义与默认值见 config.py，术语见 CONTEXT.md；两处默认值必须逐项一致。

[plugin]
# 插件总开关。默认关闭：先填好白名单再打开，避免安装即跨群发送。
enabled = false
# 配置版本：新增字段时提升（数字点分），宿主据此把新字段写回配置文件。
config_version = "1.5.0"

[auto]
# 自动判断入口：只控制所选候选类型的自动判断机会，不影响显式工具调用。
enabled = true
# 自动候选类型：可选 "text"（普通文字）、"image"（图片）、"forward"（合并转发）。
# 默认仅合并转发；留空数组 = 停止所有自动判断机会；开启文字或图片会增加模型调用。
message_types = ["forward"]
# 自动分享标准：传给源群 Maisaka 的自然语言判断依据（最多 4000 字符）。
# 留空或全空白时回退默认标准；正文与群名不会成为该标准。
share_criteria = "结合消息内容与目标群，自行判断是否值得分享；不值得或无法判断时保持沉默，不必回复，不要编造消息内容。"

[scope]
# 源群白名单：允许麦麦从中转发消息的群号；留空则没有源群。
source_groups = []
# 目标群白名单：允许接收转发消息的群号；留空则没有目标群。
target_groups = []

[snowluma]
# SnowLuma 已有正向 HTTP API 地址：明文 http 只允许回环、私有或链路本地目标，主机名
# 在发出请求前解析确认（解析出公网或失败即拒绝）；公网目标必须 https 并校验证书。
# 默认不连接；不接受用户信息、查询串、片段或 0.0.0.0 等未指定监听地址；不自动发现端点。
http_url = ""
# 可直接填写令牌（优先使用）；留空或全空白时仅在发出请求前读取下面的环境变量。
# 明文保存于配置文件，请限制文件权限，不要将真实令牌提交到仓库。
token = ""
# 凭证环境变量名：只填变量名；未填写令牌时，发出请求前才读取该变量，缺值拒绝请求。
token_env_var = ""
