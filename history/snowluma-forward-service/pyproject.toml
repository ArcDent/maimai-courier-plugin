# 独立 SnowLuma 转发服务的项目级运行环境（design D1）。
#
# - 依赖按第 1 组 1.5 核实结果锁定：宿主 MaiBot 约束 `aiohttp>=3.14.3`
#   （MaiBot `pyproject.toml:12`），服务端与客户端统一使用同一网络栈；
# - `package = false`：项目环境只负责安装依赖，插件目录不是可安装包；服务与共享层
#   以源码目录方式在仓库根运行（`uv sync` 安装依赖，`uv run python -m service ...`）；
# - `requires-python = ">=3.11"`：服务端配置用标准库 `tomllib` 解析，不新增依赖
#   （宿主 MaiBot 自身要求 >=3.12，部署环境满足）；
# - 不声明任何插件侧依赖：插件依赖装载机制仍走 `_manifest.json`（第 6.1 组）。
[project]
name = "maimai-courier-forward-service"
version = "0.1.0"
description = "麦麦搬运喵的独立 SnowLuma 转发服务（与 MaiBot 插件同仓库）"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14.3"]

[tool.uv]
package = false
