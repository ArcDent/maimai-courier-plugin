# 麦麦搬运喵配置
# 字段含义与默认值见 config.py，术语见 CONTEXT.md；两处默认值必须逐项一致。

[plugin]
# 插件总开关。默认关闭：先填好白名单再打开，避免安装即跨群发送。
enabled = false
# 配置版本：新增字段时提升（数字点分），宿主据此把新字段写回配置文件。
config_version = "1.2.0"

[auto]
# 自动判断入口：只控制所选候选类型的自动判断机会，不影响显式工具调用。
enabled = true
# 自动候选类型：可选 "text"（普通文字）、"image"（图片）、"forward"（合并转发）。
# 默认仅合并转发；留空数组 = 停止所有自动判断机会；开启文字或图片会增加模型调用。
message_types = ["forward"]
# 自动分享标准：传给源群 Maisaka 的自然语言判断依据（最多 4000 字符）。
# 留空或全空白时回退默认标准；正文与群名不会成为该标准。
share_criteria = "结合消息内容与目标群，自行判断是否值得分享；不值得或无法判断时保持沉默，不必回复，不要编造消息内容。"

[scope]
# 源群白名单：允许麦麦从中转发消息的群号；留空则没有源群。
source_groups = []
# 目标群白名单：允许接收转发消息的群号；留空则没有目标群。
target_groups = []

[service]
# 专用转发服务地址：只连本机回环时可用 http；跨主机必须 https（或受控加密隧道）。
# 不接受含凭证、查询串或片段的地址；真实发送只走该服务，不退回宿主旧发送通道。
endpoint = "http://127.0.0.1:8787"
# 客户端身份名：向服务声明的认证主体（服务端据此绑定允许的源/目标权限上限）。
client_identity = "maibot-plugin"
# 凭证环境变量名：网关/客户端只从该环境变量读取凭证，配置里不填凭证值。
token_env_var = "COURIER_SERVICE_TOKEN"
# 预期账本 ID：服务端初始化/迁移时生成；留空或与实际不符时工具调用一律拒绝。
expected_ledger_id = ""
# 迁移确认标识：显式确认本次使用的数据集（新装或迁移），留空时禁止发送。
migration_confirmation = ""
