schema: spec-driven

# 创建工件（proposal/design/tasks/specs）时展示给 AI 的项目上下文
context: |
  麦麦搬运喵（maimai-courier-plugin）是独立的 MaiBot 插件，不复用 repeat-plugin，
  状态只在宿主授予的 data_dir。代码、注释、文档均中文。
  文档纪律：AGENTS.md 是项目级规则文件，只放 agent 必须遵守的约束；
  架构现状、模块职责、验证实测数字不属于 AGENTS.md，写在任务「证据」行内或
  openspec/specs/ 主规格、README、docs/adr/ 中。
  openspec 变更不得把 AGENTS.md 列为同步目标；确需修改 AGENTS.md 的规则条款时，
  先在任务里写明理由并等待用户确认，再动手。

# 按工件类型的生成规则
rules:
  tasks:
    - 文档同步任务只能指向 openspec/specs/ 主规格、README.md、docs/adr/，不得包含 AGENTS.md
    - 验证实测数字写在任务「证据」行内，不写入 AGENTS.md 等常驻规则文件
    - 需要改 AGENTS.md 时，任务项须注明「待用户确认」，未确认不得执行
    - 任务只到代码改动与可在本机跑完的验证；部署、发版、重启服务、灌生产配置、实机验收不列为任务
    - 部署与回滚步骤写在 design.md 的 Migration Plan，需要用户执行的动作在收尾交接里列为「待你执行」

# 按操作的执行指引
operations:
  archive:
    guidance:
      - 归档只把 delta 同步进 openspec/specs/ 主规格并更新指向，不改写 AGENTS.md
      - 汇总归档结果时说明改了哪些规格与文档，不把 AGENTS.md 算作同步目标
